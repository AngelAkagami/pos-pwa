# netlify.toml — sitio publicado en https://tablero-kenal.netlify.app/
# Conectado a GitHub (github.com/AngelAkagami/pos-pwa): cada push despliega.
#
# El sitio es 100% estático. El ÚNICO paso de build genera js/config.js
# (que Git ignora a propósito) desde las Environment variables del sitio:
#   SUPABASE_URL, SUPABASE_ANON_KEY [, SUPABASE_BOARD_SLUG, SUPABASE_MEMBERS]
# Si faltan URL/clave se usan los valores de respaldo de generate-config.js.
# Si los valores son inválidos, el build falla y NO se publica una versión rota.
#
# Frontend (Netlify) + backend (Supabase). Netlify NO sincroniza datos
# entre usuarios: eso lo hace Supabase Realtime.

[build]
  command = "node scripts/generate-config.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Cabeceras de seguridad básicas (no sustituyen a las políticas RLS).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-store"
